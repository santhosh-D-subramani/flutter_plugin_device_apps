name: device_apps_ng
description: Maintained fork of device_apps. List installed Android apps fast (lazy icons), get details (permissions, installer, signatures) and listen to app changes.
version: 3.0.2
repository: https://github.com/santhosh-D-subramani/flutter_plugin_device_apps
issue_tracker: https://github.com/santhosh-D-subramani/flutter_plugin_device_apps/issues
topics:
  - android
  - apps
  - package-manager
  - installed-apps

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: fr.g123k.deviceapps
        pluginClass: DeviceAppsPlugin
